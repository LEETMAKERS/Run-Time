[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
build_src_filter = +<main.cpp> -<tests/> -<test-buttons.cpp> -<test-display.cpp>

[env:buttons]
extends = env:esp32dev
build_src_filter = +<test-buttons.cpp> -<main.cpp> -<tests/> -<test-display.cpp>

[env:display-test]
extends = env:esp32dev
lib_deps =
    ${env:esp32dev.lib_deps}
    adafruit/Adafruit ILI9341
build_src_filter = +<test-display.cpp> -<main.cpp> -<test-buttons.cpp> -<tests/>
